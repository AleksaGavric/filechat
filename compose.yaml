services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: documents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documents"]
      interval: 5s
      timeout: 5s
      retries: 10
  filechat:
    build: .
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      PGVECTOR_CONNECTION: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/documents
      DOCUMENT_ROOT: /documents
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4}
    volumes:
      - ./US-Constitution-With-Amendments.txt:/documents/US-Constitution-With-Amendments.txt:ro
      - ./reagan.txt:/documents/reagan.txt:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
